  - title: Research Perspective
    icon: i-mdi:lightbulb-outline
    items:
      - title: Mathematical craft
        description: I enjoy the craft of proof and the quiet pleasure of making an idea mathematically clean, while persistently pursuing frontier problems around large language models.
      - title: Optimization and incentives
        description: My work often alternates between designing mechanisms that leave players no unintended room to optimize against a system and finding the best response under constraints myself.
      - title: Computation and consciousness
        description: I lean toward a materialist monism, viewing human consciousness and AI awareness as abstractions over physical and computational processes rather than independent substances.
