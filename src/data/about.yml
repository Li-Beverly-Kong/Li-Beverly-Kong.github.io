experience:
  - role: Algorithm Intern, TikTok User Growth
    organization: ByteDance
    period: Jan 2025 - Jan 2026
    bullets:
      - Worked on user growth modeling and intelligent coupon allocation for TikTok Shop's Latin America new-user scenarios.
      - Co-authored an AAAI 2026 paper on sequence-aware coupon allocation, validated in Southeast Asia returning-user recall scenarios.
      - Improved offline AUCC by 26% while iterating decision-focused learning methods for Mexico new-user growth optimization.
  - role: Algorithm Intern, AI Product Innovation Department
    organization: Baidu
    period: Jul 2024 - Nov 2024
    bullets:
      - Developed LLM-powered suggestion recommendation for the Wenxiaoyan app.
      - Built data filtering and supervised fine-tuning workflows that improved suggestion diversity and quality.
      - Collaborated on large-scale sample generation, diversity optimization, and sharded deployment experiments.
  - role: Participant, International Programme on AI Evaluation Capabilities & Safety
    organization: Full-funded academic programme
    period: Feb 2026 - May 2026
    bullets:
      - Studied frontier topics in LLM evaluation and developed ongoing research on evaluation awareness.

